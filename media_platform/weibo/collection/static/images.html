<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="collection-token" content="__COLLECTION_TOKEN__">
  <title>微博内容采集</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#182431;background:#f3f5f8}
    *{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:42px auto;padding:0 24px}
    header{margin-bottom:28px}h1{font-size:30px;margin:0 0 10px}h2{font-size:19px;margin:0 0 16px}
    p{line-height:1.7}small,.muted{color:#647489}.panel{background:white;border:1px solid #e2e7ee;border-radius:16px;padding:24px;margin-bottom:20px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    input[type=url],input[type=text]{font:inherit;width:100%;padding:14px;border:1px solid #b9c5d3;border-radius:9px;margin:8px 0 16px}
    label{display:block;line-height:1.7}button,.button{font:inherit;padding:11px 18px;border:0;border-radius:9px;background:#215bd5;color:white;cursor:pointer;text-decoration:none;display:inline-block}
    button.secondary{background:#eaf0fb;color:#20497e}button:disabled{opacity:.45;cursor:default}a{color:#215bd5}
    .options{display:grid;gap:8px;margin:8px 0 20px}.error{color:#a12e20}.hidden{display:none!important}
    #qr{width:260px;height:260px;object-fit:contain;border:1px solid #e2e7ee;background:white;padding:15px}
    progress{width:100%;height:16px;accent-color:#215bd5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .image-card{padding:12px;border:1px solid #e2e7ee;border-radius:12px;overflow-wrap:anywhere}.image-card img{width:100%;height:250px;object-fit:contain;background:#f6f8fb;border-radius:8px}
    .image-card .row{font-size:14px;margin-top:12px}.job{width:100%;text-align:left;background:#f1f5fc;color:#233b58;margin-top:8px;padding:12px}.job small{display:block;margin-top:6px}
    #notice{padding:0 0 15px;min-height:20px}.status{font-size:20px;font-weight:600}.source{overflow-wrap:anywhere;font-size:14px}
    @media(max-width:780px){main{margin:24px auto;padding:0 14px}.layout{grid-template-columns:1fr}.panel{padding:18px}}
  </style>
</head>
<body><main>
  <header><h1>微博内容采集</h1><div class="muted">粘贴一条微博链接，按需采集正文和图片。</div></header>
  <div class="layout"><section>
    <form id="form" class="panel">
      <label for="url">微博链接或 ID</label><input id="url" type="text" required placeholder="https://weibo.com/用户ID/微博短码" autocomplete="off">
      <div class="options">
        <label><input type="checkbox" id="collectImages" checked> 采集图片</label>
        <label><input type="checkbox" id="download" checked> 下载图片文件（关闭后只解析地址）</label>
        <label><input type="checkbox" id="retweeted"> 包含转发原文的图片</label>
        <label><input type="checkbox" id="collectText"> 采集正文</label>
        <label><input type="checkbox" id="browser"> 允许本次任务使用项目中已登录的微博账号</label>
        <small>默认先公开访问。需要登录时可选择扫码；登录信息仅保留在本机。</small>
      </div><button id="submit" type="submit">开始采集</button>
    </form>
    <div id="notice" role="alert" class="error"></div>
    <section id="task" class="panel hidden">
      <h2>当前任务</h2><p id="phase" class="status" aria-live="polite"></p><p id="source" class="source muted"></p>
      <progress id="progress" max="1" value="0"></progress><p id="counts" class="muted"></p><p id="reason" class="error"></p>
      <div id="login" class="hidden"><p>请用微博 App 扫描并在手机确认。二维码会自动更新，超时后可重新扫码。</p><img id="qr" alt="微博官方登录二维码"></div>
      <div class="row">
        <button id="retry" class="secondary hidden" type="button">重试未完成部分</button>
        <button id="signin" class="secondary hidden" type="button">允许扫码登录并继续</button>
        <button id="cancel" class="secondary hidden" type="button">取消任务</button>
        <a id="archive" class="button hidden">下载全部图片</a>
      </div><small id="consent" class="hidden">扫码会更新本项目的微博登录态，仅用于你提交的任务，不显示或导出 Cookie。</small>
    </section>
    <section id="results" class="panel hidden"><h2>图片结果</h2><div id="images" class="grid"></div></section>
    <section id="text-results" class="panel hidden"><h2>正文结果</h2><div id="texts"></div></section>
  </section><aside class="panel"><h2>任务记录</h2><p class="muted">刷新页面不会停止任务。服务重启后可恢复未完成任务。</p><div id="history"></div></aside></div>
</main><script>
const $=id=>document.getElementById(id);
const token=document.querySelector('meta[name=collection-token]').content;
let selected=null,qrVersion=-1,rendered='',renderedTexts='',polling=false;
const active=new Set(['queued','collecting','downloading','waiting_login']);
const labels={queued:'准备中',collecting:'正在获取微博图片',downloading:'正在处理图片',waiting_login:'等待扫码确认',completed:'采集完成',partial:'部分完成',restricted:'需要登录或访问受限',failed:'任务失败',cancelled:'已取消',interrupted:'上次任务已中断'};
const errors={login_required:'需要登录微博。你可以扫码登录后继续。',access_restricted:'微博暂时限制了访问，可扫码后重试；仍失败时请稍后再试。',login_timeout:'扫码等待已超时，页面仍可使用，点击扫码按钮重新开始。',browser_profile_in_use:'项目登录目录正被其他任务使用，请待其结束后重试。',browser_profile_unavailable:'微博浏览器未能启动，请检查 Chrome 和正在使用该登录目录的任务。',qr_unavailable:'二维码暂未加载完成，请重新扫码登录。',detail_unavailable:'该微博详情不可用，可能已删除或当前账号不可见。',detail_request_failed:'微博详情请求失败，请重试。',asset_request_failed:'图片下载失败，重试会保留已成功的图片。',image_request_failed:'图片下载失败。',manifest_unverified:'已取得部分图片，但尚不能确认图片列表完整。',full_text_unavailable:'接口返回的正文可能被截断，暂不能确认全文完整。',text_too_large:'正文超过本地保存上限。',select_at_least_one_capability:'请至少选择正文或图片。',service_restarted:'服务曾重启，可恢复这项任务。',another_job_running:'已有任务正在运行，请先等待或取消。',job_already_completed:'任务已完成，如需重新检查请提交新任务。',unexpected_job_error:'执行遇到错误，请重试；持续失败时请查看本地服务日志。'};
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Collection-Token':token},body:body===undefined?undefined:JSON.stringify(body)});let value=await r.json();if(!r.ok){let detail=value.detail;throw Error(typeof detail==='string'?(errors[detail]||detail):'链接或参数无效，请输入一条微博链接。');}return value;}
function showError(e){$('notice').textContent=e.message||'请求失败，请检查页面服务是否运行。';}
function choose(id){selected=id;qrVersion=-1;rendered='';renderedTexts='';try{localStorage.setItem('weibo-image-job',id);}catch(e){}poll();}
function render(job){
  $('task').classList.remove('hidden');$('phase').textContent=labels[job.phase]||job.phase;$('source').textContent=job.url;
  $('progress').max=Math.max(job.total||1,1);$('progress').value=job.completed||0;
  const unit=job.progress_capability==='images'?'张':job.progress_capability==='text'?'条':'项';
  $('counts').textContent=job.total===null?'等待获取采集数量':`已处理 ${job.completed} / ${job.total} ${unit}`;
  $('reason').textContent=job.error_code?(errors[job.error_code]||'部分数据未完成，请重试。'):'';
  $('cancel').classList.toggle('hidden',!active.has(job.phase));
  $('retry').classList.toggle('hidden',!['partial','failed','cancelled','interrupted','restricted'].includes(job.phase));
  const canLogin=job.phase==='restricted';$('signin').classList.toggle('hidden',!canLogin);$('consent').classList.toggle('hidden',!canLogin);
  $('login').classList.toggle('hidden',job.phase!=='waiting_login');
  if(job.phase==='waiting_login'&&job.qr_version>0&&qrVersion!==job.qr_version){qrVersion=job.qr_version;$('qr').src=`/api/jobs/${job.id}/qr?v=${qrVersion}`;}
  const signature=JSON.stringify(job.images);
  if(signature!==rendered){rendered=signature;$('images').replaceChildren();job.images.forEach((item,i)=>{
    const card=document.createElement('article');card.className='image-card';
    if(item.downloaded){const link=document.createElement('a');link.href=`/api/jobs/${job.id}/images/${i}`;link.target='_blank';const img=document.createElement('img');img.src=link.href;img.loading='lazy';img.alt=`图片 ${i+1}`;link.append(img);card.append(link);}
    const text=document.createElement('p');text.textContent=`图片 ${i+1} · `+(item.downloaded?'已下载':item.status==='succeeded'?'已解析地址，未下载':'未完成');card.append(text);
    if(item.error_code){const error=document.createElement('p');error.className='error';error.textContent=errors[item.error_code]||'图片处理失败';card.append(error);}
    const links=document.createElement('div');links.className='row';const source=document.createElement('a');source.textContent='原图地址';source.href=item.url;source.rel='noreferrer';source.target='_blank';links.append(source);
    if(item.downloaded){const download=document.createElement('a');download.href=`/api/jobs/${job.id}/images/${i}?download=true`;download.textContent='下载图片';links.append(download);}card.append(links);$('images').append(card);
  });}
  $('results').classList.toggle('hidden',job.images.length===0);
  const textSignature=JSON.stringify(job.texts);
  if(textSignature!==renderedTexts){renderedTexts=textSignature;$('texts').replaceChildren();job.texts.forEach(item=>{
    const card=document.createElement('article');card.className='image-card';
    const heading=document.createElement('p');heading.textContent=`微博 ${item.note_id} · `+(item.complete?'正文完整':'正文可能不完整');card.append(heading);
    const body=document.createElement('pre');body.style.whiteSpace='pre-wrap';body.style.overflowWrap='anywhere';body.textContent=item.text;card.append(body);
    if(item.error_code){const warning=document.createElement('p');warning.className='error';warning.textContent=errors[item.error_code]||'正文未能完整获取';card.append(warning);}
    $('texts').append(card);
  });}
  $('text-results').classList.toggle('hidden',job.texts.length===0);
  const downloaded=job.images.filter(x=>x.downloaded).length;$('archive').classList.toggle('hidden',!downloaded);$('archive').href=`/api/jobs/${job.id}/archive`;
  if(job.phase==='completed'&&!job.images.length)$('counts').textContent='这条微博没有可采集的图片。';
}
async function poll(){if(polling)return;polling=true;try{const jobs=await api('/api/jobs');$('history').replaceChildren();jobs.forEach(job=>{const button=document.createElement('button');button.className='job';button.textContent=labels[job.phase]||job.phase;const small=document.createElement('small');small.textContent=job.url;button.append(small);button.onclick=()=>choose(job.id);$('history').append(button);});$('submit').disabled=jobs.some(j=>active.has(j.phase));if(selected){const job=jobs.find(j=>j.id===selected);if(job)render(job);}}catch(e){showError(e);}finally{polling=false;}}
$('collectImages').onchange=()=>{const enabled=$('collectImages').checked;$('download').disabled=!enabled;$('retweeted').disabled=!enabled;};
$('form').onsubmit=async e=>{e.preventDefault();$('notice').textContent='';try{if(!$('collectImages').checked&&!$('collectText').checked)throw Error(errors.select_at_least_one_capability);const job=await api('/api/jobs','POST',{url:$('url').value,include_images:$('collectImages').checked,include_text:$('collectText').checked,download:$('download').checked,include_retweeted:$('retweeted').checked,use_browser_session:$('browser').checked});choose(job.id);}catch(error){showError(error);}};
$('retry').onclick=async()=>{try{await api(`/api/jobs/${selected}/retry`,'POST',{});await poll();}catch(e){showError(e);}};
$('signin').onclick=async()=>{try{await api(`/api/jobs/${selected}/retry`,'POST',{login:true,consent:true});qrVersion=-1;await poll();}catch(e){showError(e);}};
$('cancel').onclick=async()=>{try{await api(`/api/jobs/${selected}/cancel`,'POST',{});await poll();}catch(e){showError(e);}};
try{selected=localStorage.getItem('weibo-image-job');}catch(e){}poll();setInterval(poll,1500);
</script></body></html>
