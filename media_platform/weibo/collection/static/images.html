<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="collection-token" content="__COLLECTION_TOKEN__">
  <title>微博内容采集</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#182431;background:#f3f5f8}
    *{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:42px auto;padding:0 24px}
    header{margin-bottom:28px}h1{font-size:30px;margin:0 0 10px}h2{font-size:19px;margin:0 0 16px}
    p{line-height:1.7}small,.muted{color:#647489}.panel{background:white;border:1px solid #e2e7ee;border-radius:16px;padding:24px;margin-bottom:20px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    input[type=url],input[type=text],input[type=number],select{font:inherit;width:100%;padding:14px;border:1px solid #b9c5d3;border-radius:9px;margin:8px 0 16px}
    label{display:block;line-height:1.7}button,.button{font:inherit;padding:11px 18px;border:0;border-radius:9px;background:#215bd5;color:white;cursor:pointer;text-decoration:none;display:inline-block}
    button.secondary{background:#eaf0fb;color:#20497e}button:disabled{opacity:.45;cursor:default}a{color:#215bd5}
    .options{display:grid;gap:8px;margin:8px 0 20px}.error{color:#a12e20}.hidden{display:none!important}
    #qr{width:260px;height:260px;object-fit:contain;border:1px solid #e2e7ee;background:white;padding:15px}
    progress{width:100%;height:16px;accent-color:#215bd5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .image-card{padding:12px;border:1px solid #e2e7ee;border-radius:12px;overflow-wrap:anywhere}.image-card img{width:100%;height:250px;object-fit:contain;background:#f6f8fb;border-radius:8px}
    .image-card .row{font-size:14px;margin-top:12px}.job{width:100%;text-align:left;background:#f1f5fc;color:#233b58;margin-top:8px;padding:12px}.job small{display:block;margin-top:6px}
    #notice{padding:0 0 15px;min-height:20px}.status{font-size:20px;font-weight:600}.source{overflow-wrap:anywhere;font-size:14px}
    @media(max-width:780px){main{margin:24px auto;padding:0 14px}.layout{grid-template-columns:1fr}.panel{padding:18px}}
  </style>
</head>
<body><main>
  <header><h1>微博内容采集</h1><div class="muted">选择采集范围和内容类型，按需获取微博数据。</div></header>
  <div class="layout"><section>
    <form id="form" class="panel">
      <label for="sourceType">采集范围</label><select id="sourceType"><option value="detail">单条微博</option><option value="creator">用户主页</option><option value="self_favorites">我的收藏</option><option value="self_liked">我赞过</option></select>
      <div id="target-field"><label id="target-label" for="url">微博链接或 ID</label><input id="url" type="text" required placeholder="https://weibo.com/用户ID/微博短码" autocomplete="off"></div>
      <small id="source-help" class="muted"></small>
      <label id="limit-field" class="hidden" for="maxPosts">最多采集微博数（到上限时会标为部分完成）</label><input id="maxPosts" class="hidden" type="number" min="1" max="10000" value="1000">
      <div class="options">
        <label><input type="checkbox" id="collectImages" checked> 采集图片</label>
        <label><input type="checkbox" id="download" checked> 下载图片文件（关闭后只解析地址）</label>
        <label><input type="checkbox" id="retweeted"> 包含转发原文媒体</label>
        <label><input type="checkbox" id="collectText"> 采集正文</label>
        <label><input type="checkbox" id="collectVideo"> 下载视频</label>
        <label><input type="checkbox" id="collectAudio"> 下载音频</label>
        <label><input type="checkbox" id="collectComments"> 采集热评流一级评论</label>
        <label><input type="checkbox" id="collectMetrics"> 采集互动计数（赞、评、转）</label>
        <label id="comment-limit-field" class="hidden" for="maxComments">最多采集一级评论数</label><input id="maxComments" class="hidden" type="number" min="1" max="500" value="100">
        <label><input type="checkbox" id="browser"> 允许本次任务使用项目中已登录的微博账号</label>
        <small>默认先公开访问。需要登录时可选择扫码；登录信息仅保留在本机。</small>
      </div><button id="submit" type="submit">开始采集</button>
    </form>
    <div id="notice" role="alert" class="error"></div>
    <section id="task" class="panel hidden">
      <h2>当前任务</h2><p id="phase" class="status" aria-live="polite"></p><p id="source" class="source muted"></p>
      <progress id="progress" max="1" value="0"></progress><p id="counts" class="muted"></p><p id="reason" class="error"></p><p id="coverage" class="muted"></p>
      <div id="login" class="hidden"><p>请用微博 App 扫描并在手机确认。二维码会自动更新，超时后可重新扫码。</p><img id="qr" alt="微博官方登录二维码"></div>
      <div class="row">
        <button id="retry" class="secondary hidden" type="button">重试未完成部分</button>
        <button id="signin" class="secondary hidden" type="button">允许扫码登录并继续</button>
        <button id="cancel" class="secondary hidden" type="button">取消任务</button>
        <a id="archive" class="button hidden">打包下载成功文件</a>
      </div><small id="consent" class="hidden">扫码会更新本项目的微博登录态，仅用于你提交的任务，不显示或导出 Cookie。</small>
    </section>
    <section id="results" class="panel hidden"><h2>图片结果</h2><div id="images" class="grid"></div></section>
    <section id="text-results" class="panel hidden"><h2>正文结果</h2><div id="texts"></div></section>
    <section id="media-results" class="panel hidden"><h2>视频与音频</h2><div id="media" class="grid"></div></section>
    <section id="comment-results" class="panel hidden"><h2>热评流一级评论</h2><div id="comments" class="grid"></div></section>
    <section id="metrics-results" class="panel hidden"><h2>互动计数</h2><div id="metrics" class="grid"></div></section>
  </section><aside class="panel"><h2>任务记录</h2><p class="muted">刷新页面不会停止任务。服务重启后可恢复未完成任务。</p><div id="history"></div></aside></div>
</main><script>
const $=id=>document.getElementById(id);
const token=document.querySelector('meta[name=collection-token]').content;
let selected=null,qrVersion=-1,rendered='',renderedTexts='',renderedComments='',renderedMetrics='',polling=false;
const active=new Set(['queued','collecting','downloading','waiting_login']);
const labels={queued:'准备中',collecting:'正在获取微博内容',downloading:'正在下载采集内容',waiting_login:'等待扫码确认',completed:'采集完成',partial:'部分完成或达到数量上限',restricted:'需要登录或访问受限',failed:'任务失败',cancelled:'已取消',interrupted:'上次任务已中断'};
const errors={login_required:'需要登录微博。你可以扫码登录后继续。',access_restricted:'微博暂时限制了访问，可扫码后重试；仍失败时请稍后再试。',login_timeout:'扫码等待已超时，页面仍可使用，点击扫码按钮重新开始。',browser_profile_in_use:'项目登录目录正被其他任务使用，请待其结束后重试。',browser_profile_unavailable:'微博浏览器未能启动，请检查 Chrome 和正在使用该登录目录的任务。',qr_unavailable:'二维码暂未加载完成，请重新扫码登录。',self_feed_requires_login:'“我的收藏 / 我赞过”需要勾选“允许本次任务使用项目中已登录的微博账号”。',current_user_unavailable:'无法从当前登录会话确认微博账号，请检查登录状态后重试。',source_identity_changed:'当前登录账号与原任务不一致，不能继续恢复这项任务。',source_checkpoint_invalid:'来源续跑记录无法读取，请新建任务重新采集。',source_checkpoint_mismatch:'来源与原任务不匹配，请检查任务请求后重试。',source_changed_since_checkpoint:'本地归档在任务中断后发生变化，请新建任务重新扫描。',self_feed_request_failed:'账号收藏或赞过列表请求失败，请重试。',invalid_self_feed_page:'账号收藏或赞过列表返回的数据格式暂不支持。',empty_self_feed_page_unverified:'列表分页出现空档，无法确认是否完整；任务已停止。',self_feed_page_repeated:'账号列表重复返回同一页，任务已停止以免循环。',self_feed_page_limit:'账号列表翻页超过安全上限。',detail_unavailable:'该微博详情不可用，可能已删除或当前账号不可见。',detail_request_failed:'微博详情请求失败，请重试。',creator_request_failed:'用户主页请求失败，请重试。',invalid_creator_page:'用户主页返回的数据格式暂不支持。',creator_page_repeated:'用户主页重复返回同一页，任务已停止以免循环。',creator_page_limit:'用户主页翻页数超过安全上限。',comments_request_failed:'热评流请求失败，请重试。',invalid_comments_page:'热评流返回的数据格式暂不支持。',empty_comments_page_unverified:'热评流分页出现空档，无法确认覆盖范围。',comments_cursor_stalled:'热评流分页游标未前进，任务已停止。',comments_page_limit:'热评流分页超过安全上限。',comments_limit_reached:'已达到一级评论数量上限。',asset_request_failed:'媒体下载失败，重试会保留已成功的文件。',image_request_failed:'图片下载失败。',invalid_video_content:'视频文件格式校验失败。',invalid_audio_content:'音频文件格式校验失败。',unsupported_media_host:'媒体地址不属于支持的微博 CDN。',asset_too_large:'媒体文件超过本地下载上限。',media_manifest_unverified:'接口未能确认完整的媒体地址。',manifest_unverified:'已取得部分图片，但尚不能确认图片列表完整。',full_text_unavailable:'接口返回的正文可能被截断，暂不能确认全文完整。',text_too_large:'正文超过本地保存上限。',select_at_least_one_capability:'请至少选择正文、图片、视频、音频或评论。',service_restarted:'服务曾重启，可恢复这项任务。',another_job_running:'已有任务正在运行，请先等待或取消。',job_already_completed:'任务已完成，如需重新检查请提交新任务。',unexpected_job_error:'执行遇到错误，请重试；持续失败时请查看本地服务日志。'};
Object.assign(errors,{metrics_request_failed:'互动计数请求失败，请重试。',metrics_unavailable:'接口没有返回可用的互动计数。',metrics_incomplete:'接口只返回了部分互动计数。',select_at_least_one_capability:'请至少选择正文、图片、视频、音频、评论或互动计数。'});
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Collection-Token':token},body:body===undefined?undefined:JSON.stringify(body)});let value=await r.json();if(!r.ok){let detail=value.detail;throw Error(typeof detail==='string'?(errors[detail]||detail):'链接或参数无效，请输入一条微博链接。');}return value;}
function showError(e){$('notice').textContent=e.message||'请求失败，请检查页面服务是否运行。';}
function choose(id){selected=id;qrVersion=-1;rendered='';renderedTexts='';renderedComments='';renderedMetrics='';try{localStorage.setItem('weibo-image-job',id);}catch(e){}poll();}
function render(job){
  $('task').classList.remove('hidden');$('phase').textContent=labels[job.phase]||job.phase;$('source').textContent=job.url;
  $('progress').max=Math.max(job.total||1,1);$('progress').value=job.completed||0;
  const unit=job.progress_capability==='images'?'张':job.progress_capability==='comments'?'条':job.progress_capability==='text'?'条':'项';
  $('counts').textContent=job.total===null?'等待获取采集数量':`已处理 ${job.completed} / ${job.total} ${unit}`;
  if(job.discovered!==null&&job.discovered!==undefined){const limitNote=job.stop_reason==='limit_reached'?' · 已达到本次上限，可能还有更早微博':'';$('counts').textContent=`本次发现 ${job.discovered} 条微博${limitNote}`;}
  $('reason').textContent=job.error_code?(errors[job.error_code]||'部分数据未完成，请重试。'):'';
  const coverage=job.source;if(!coverage){$('coverage').textContent='';}else if(coverage.changed_pages||coverage.pending_gap_count||coverage.unresolved_gap_count){$('coverage').textContent=`分页核对发现 ${coverage.changed_pages} 页内容有变化；${coverage.pending_gap_count} 条微博仍待核对，${coverage.unresolved_gap_count} 条在本次重扫范围内未找到。`;}else if(coverage.overlap_verified){$('coverage').textContent=`已重扫最近 ${coverage.overlap_pages||0} 页，未发现分页变化。`;}else{$('coverage').textContent=`任务恢复时会重扫最近 ${coverage.overlap_pages||0} 页以核对分页变化。`;}
  $('cancel').classList.toggle('hidden',!active.has(job.phase));
  $('retry').classList.toggle('hidden',!['partial','failed','cancelled','interrupted','restricted'].includes(job.phase));
  const canLogin=job.phase==='restricted';$('signin').classList.toggle('hidden',!canLogin);$('consent').classList.toggle('hidden',!canLogin);
  $('login').classList.toggle('hidden',job.phase!=='waiting_login');
  if(job.phase==='waiting_login'&&job.qr_version>0&&qrVersion!==job.qr_version){qrVersion=job.qr_version;$('qr').src=`/api/jobs/${job.id}/qr?v=${qrVersion}`;}
  const signature=JSON.stringify(job.images);
  if(signature!==rendered){rendered=signature;$('images').replaceChildren();job.images.forEach((item,i)=>{
    const card=document.createElement('article');card.className='image-card';
    if(item.downloaded){const link=document.createElement('a');link.href=`/api/jobs/${job.id}/images/${i}`;link.target='_blank';const img=document.createElement('img');img.src=link.href;img.loading='lazy';img.alt=`图片 ${i+1}`;link.append(img);card.append(link);}
    const text=document.createElement('p');text.textContent=`图片 ${i+1} · `+(item.downloaded?'已下载':item.status==='succeeded'?'已解析地址，未下载':'未完成');card.append(text);
    if(item.error_code){const error=document.createElement('p');error.className='error';error.textContent=errors[item.error_code]||'图片处理失败';card.append(error);}
    const links=document.createElement('div');links.className='row';const source=document.createElement('a');source.textContent='原图地址';source.href=item.url;source.rel='noreferrer';source.target='_blank';links.append(source);
    if(item.downloaded){const download=document.createElement('a');download.href=`/api/jobs/${job.id}/images/${i}?download=true`;download.textContent='下载图片';links.append(download);}card.append(links);$('images').append(card);
  });}
  $('results').classList.toggle('hidden',job.images.length===0);
  const textSignature=JSON.stringify(job.texts);
  if(textSignature!==renderedTexts){renderedTexts=textSignature;$('texts').replaceChildren();job.texts.forEach(item=>{
    const card=document.createElement('article');card.className='image-card';
    const heading=document.createElement('p');heading.textContent=`微博 ${item.note_id} · `+(item.complete?'正文完整':'正文可能不完整');card.append(heading);
    const body=document.createElement('pre');body.style.whiteSpace='pre-wrap';body.style.overflowWrap='anywhere';body.textContent=item.text;card.append(body);
    if(item.error_code){const warning=document.createElement('p');warning.className='error';warning.textContent=errors[item.error_code]||'正文未能完整获取';card.append(warning);}
    $('texts').append(card);
  });}
  $('text-results').classList.toggle('hidden',job.texts.length===0);
  $('media').replaceChildren();
  for(const [kind,items] of [['video',job.video],['audio',job.audio]])items.forEach((item,i)=>{
    const card=document.createElement('article');card.className='image-card';
    const heading=document.createElement('p');heading.textContent=`${kind==='video'?'视频':'音频'} ${i+1} · `+(item.downloaded?'已下载':item.status==='succeeded'?'已解析地址':'未完成');card.append(heading);
    if(item.downloaded){const preview=kind==='video'?document.createElement('video'):document.createElement('audio');preview.controls=true;preview.preload='metadata';preview.src=`/api/jobs/${job.id}/media/${kind}/${i}`;if(kind==='video')preview.style.width='100%';card.append(preview);const link=document.createElement('a');link.href=`/api/jobs/${job.id}/media/${kind}/${i}?download=true`;link.textContent='下载文件';card.append(link);}
    const source=document.createElement('p');const original=document.createElement('a');original.href=item.url;original.target='_blank';original.rel='noreferrer';original.textContent='原始媒体地址';source.append(original);card.append(source);
    if(item.error_code){const warning=document.createElement('p');warning.className='error';warning.textContent=errors[item.error_code]||'媒体处理失败';card.append(warning);}
    $('media').append(card);
  });
  $('media-results').classList.toggle('hidden',job.video.length+job.audio.length===0);
  const commentSignature=JSON.stringify(job.comments);
  if(commentSignature!==renderedComments){renderedComments=commentSignature;$('comments').replaceChildren();job.comments.forEach(batch=>{
    const summary=document.createElement('p');summary.className='muted';summary.textContent=`微博 ${batch.note_id} · ${batch.items.length} 条一级评论 · ${batch.pages} 页`+(batch.complete?' · 本次接口分页结束':' · 已达到数量上限');$('comments').append(summary);
    batch.items.forEach(item=>{const card=document.createElement('article');card.className='image-card';const heading=document.createElement('p');heading.textContent=`#${item.rank} ${item.user_name||'微博用户'} · ${item.created_at||'时间未知'}`;card.append(heading);const body=document.createElement('p');body.textContent=item.text;card.append(body);const meta=document.createElement('small');meta.textContent=`赞 ${item.like_count}`;card.append(meta);$('comments').append(card);});
    if(batch.error_code){const warning=document.createElement('p');warning.className='error';warning.textContent=errors[batch.error_code]||'评论未能完整获取';$('comments').append(warning);}
  });}
  $('comment-results').classList.toggle('hidden',job.comments.length===0);
  const metricsSignature=JSON.stringify(job.metrics);
  if(metricsSignature!==renderedMetrics){renderedMetrics=metricsSignature;$('metrics').replaceChildren();job.metrics.forEach(item=>{
    const card=document.createElement('article');card.className='image-card';
    const heading=document.createElement('p');heading.textContent=`微博 ${item.note_id} · `+(item.complete?'计数完整':'计数不完整');card.append(heading);
    const counts=document.createElement('p');counts.textContent=`赞 ${item.like_count??'未知'} · 评论 ${item.comment_count??'未知'} · 转发 ${item.repost_count??'未知'}`;card.append(counts);
    const observed=document.createElement('small');observed.textContent=item.observed_at?`观测时间 ${item.observed_at}`:'观测时间未知';card.append(observed);
    if(item.error_code){const warning=document.createElement('p');warning.className='error';warning.textContent=errors[item.error_code]||'互动计数不完整';card.append(warning);}
    $('metrics').append(card);
  });}
  $('metrics-results').classList.toggle('hidden',job.metrics.length===0);
  const downloaded=job.images.filter(x=>x.downloaded).length+job.video.filter(x=>x.downloaded).length+job.audio.filter(x=>x.downloaded).length;$('archive').classList.toggle('hidden',!downloaded);$('archive').href=`/api/jobs/${job.id}/archive`;
  if(job.phase==='completed'&&!job.images.length&&!job.texts.length&&!job.video.length&&!job.audio.length&&!job.comments.length&&!job.metrics.length)$('counts').textContent='这条微博没有可采集的所选内容。';
}
async function poll(){if(polling)return;polling=true;try{const jobs=await api('/api/jobs');$('history').replaceChildren();jobs.forEach(job=>{const button=document.createElement('button');button.className='job';button.textContent=labels[job.phase]||job.phase;const small=document.createElement('small');small.textContent=job.url;button.append(small);button.onclick=()=>choose(job.id);$('history').append(button);});$('submit').disabled=jobs.some(j=>active.has(j.phase));if(selected){const job=jobs.find(j=>j.id===selected);if(job)render(job);}}catch(e){showError(e);}finally{polling=false;}}
$('collectImages').onchange=()=>{const enabled=$('collectImages').checked;$('download').disabled=!enabled;$('retweeted').disabled=!enabled;};
$('sourceType').onchange=()=>{const type=$('sourceType').value,creator=type==='creator',selfFeed=type==='self_favorites'||type==='self_liked',limited=creator||selfFeed;$('target-field').classList.toggle('hidden',selfFeed);$('url').required=!selfFeed;$('target-label').textContent=creator?'微博用户 UID 或主页链接':'微博链接或 ID';$('url').placeholder=creator?'数字 UID 或 https://weibo.com/u/数字UID':'https://weibo.com/用户ID/微博短码';$('limit-field').textContent=selfFeed?'最多采集微博数（到上限时会标为部分完成）':'最多采集微博数（到上限时会标为部分完成）';$('limit-field').classList.toggle('hidden',!limited);$('maxPosts').classList.toggle('hidden',!limited);$('source-help').textContent=selfFeed?'仅读取本次明确授权的当前登录账号列表；不会读取其他账号。赞过列表没有可靠总数，翻页结束按接口返回判断。':'';};$('sourceType').onchange();
$('collectComments').onchange=()=>{const enabled=$('collectComments').checked;$('comment-limit-field').classList.toggle('hidden',!enabled);$('maxComments').classList.toggle('hidden',!enabled);};
$('form').onsubmit=async e=>{e.preventDefault();$('notice').textContent='';try{if(!$('collectImages').checked&&!$('collectText').checked&&!$('collectVideo').checked&&!$('collectAudio').checked&&!$('collectComments').checked&&!$('collectMetrics').checked)throw Error(errors.select_at_least_one_capability);const type=$('sourceType').value,creator=type==='creator',selfFeed=type==='self_favorites'||type==='self_liked',comments=$('collectComments').checked,metrics=$('collectMetrics').checked;if(selfFeed&&!$('browser').checked)throw Error(errors.self_feed_requires_login);const job=await api('/api/jobs','POST',{source_type:type,url:$('url').value,max_posts:creator||selfFeed?Number($('maxPosts').value):1,include_images:$('collectImages').checked,include_text:$('collectText').checked,include_video:$('collectVideo').checked,include_audio:$('collectAudio').checked,include_comments:comments,include_metrics:metrics,max_comments:comments?Number($('maxComments').value):100,download:$('download').checked,include_retweeted:$('retweeted').checked,use_browser_session:$('browser').checked});choose(job.id);}catch(error){showError(error);}};
$('retry').onclick=async()=>{try{await api(`/api/jobs/${selected}/retry`,'POST',{});await poll();}catch(e){showError(e);}};
$('signin').onclick=async()=>{try{await api(`/api/jobs/${selected}/retry`,'POST',{login:true,consent:true});qrVersion=-1;await poll();}catch(e){showError(e);}};
$('cancel').onclick=async()=>{try{await api(`/api/jobs/${selected}/cancel`,'POST',{});await poll();}catch(e){showError(e);}};
try{selected=localStorage.getItem('weibo-image-job');}catch(e){}poll();setInterval(poll,1500);
</script></body></html>
